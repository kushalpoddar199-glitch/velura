<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Velura · On Your Floor</title>
<style>
:root{--gold:#c9a96e;--ink:#0b0a09;--paper:#f4efe6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--paper);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:24px}
#start h1{font-weight:400;letter-spacing:.35em;font-size:28px}
#start p{opacity:.7;font-size:14px;max-width:300px;line-height:1.5}
#go{background:none;border:1px solid var(--gold);color:var(--gold);padding:16px 34px;font:inherit;letter-spacing:.18em;font-size:14px;border-radius:2px}
#go:disabled{opacity:.35}
#overlay{position:fixed;inset:0;display:none;pointer-events:none}
#hint{position:absolute;top:calc(env(safe-area-inset-top) + 20px);left:50%;transform:translateX(-50%);background:rgba(11,10,9,.6);padding:10px 18px;border-radius:20px;font-size:13px;letter-spacing:.04em;white-space:nowrap;transition:opacity .3s}
#close{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:14px;pointer-events:auto;background:rgba(11,10,9,.6);color:var(--paper);border:none;width:36px;height:36px;border-radius:50%;font-size:16px}
#picker{position:absolute;left:0;right:0;bottom:0;padding:18px 0 calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(transparent,rgba(11,10,9,.9) 30%);pointer-events:auto;transform:translateY(110%);transition:transform .5s ease}
#picker.show{transform:none}
.row{display:flex;gap:10px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
#types{margin-bottom:14px}
.type{flex:0 0 auto;background:none;border:1px solid rgba(244,239,230,.3);color:var(--paper);font:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:8px 16px;border-radius:20px}
.type.on{border-color:var(--gold);color:var(--gold)}
.stone{flex:0 0 auto;width:66px;text-align:center;font-size:10px;background:none;border:none;color:inherit;font-family:inherit;opacity:.85}
.stone img{width:62px;height:62px;object-fit:cover;border-radius:50%;border:2px solid transparent;display:block;margin:0 auto 6px}
.stone.on{opacity:1}
.stone.on img{border-color:var(--gold)}
.stone span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="start">
  <h1>VELURA</h1>
  <p id="support">Checking your phone…</p>
  <button id="go" disabled>OPEN CAMERA</button>
</div>
<div id="overlay">
  <div id="hint"></div>
  <button id="close" aria-label="Close">✕</button>
  <div id="picker">
    <div id="types" class="row"></div>
    <div id="tray" class="row"></div>
  </div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ---------- SETTINGS (real-world metres) ----------
const TILE_SIZE_M  = 0.60; // one repeat of the photo = one 60 x 60 cm tile
const AREA_M       = 4.0;  // size of the marble square laid on the floor
const FLOOR_BAND_M = 0.15; // surfaces more than 15 cm above the lowest one seen are not floor

const $ = id => document.getElementById(id);
const start = $('start'), support = $('support'), go = $('go');
const overlay = $('overlay'), hint = $('hint'), closeBtn = $('close');
const picker = $('picker'), typesRow = $('types'), tray = $('tray');

// ---------- CATALOGUE ----------
let stones = [];
try {
  stones = await (await fetch('catalog.json', { cache: 'no-cache' })).json();
} catch (e) {
  support.textContent = 'Catalogue could not load. Please check your connection and reload.';
  throw e;
}
const texURL = s => `stones/${s.slug}.jpg`;
const title = f => f ? f.charAt(0).toUpperCase() + f.slice(1) : 'Other';

let current = -1, walk = null, onStonePicked = null;
const marbleMat = new THREE.MeshBasicMaterial({ color: 0xffffff }); // unlit = true photo colour
const loader = new THREE.TextureLoader();

// Stone buttons
const stoneBtns = stones.map((s, i) => {
  const b = document.createElement('button');
  b.className = 'stone';
  b.dataset.family = s.family || '';
  b.innerHTML = `<img src="${s.thumb}" alt="" loading="lazy"><span></span>`;
  b.querySelector('span').textContent = s.name;
  b.onclick = () => setStone(i);
  tray.appendChild(b);
  return b;
});

// Flooring type chips: All + every family in the catalogue
const families = [...new Set(stones.map(s => s.family || ''))];
function showType(f) {
  typesRow.querySelectorAll('.type').forEach(c => c.classList.toggle('on', c.dataset.f === f));
  stoneBtns.forEach(b => { b.style.display = (f === '*' || b.dataset.family === f) ? '' : 'none'; });
  tray.scrollLeft = 0;
}
['*', ...families].forEach(f => {
  const c = document.createElement('button');
  c.className = 'type';
  c.dataset.f = f;
  c.textContent = f === '*' ? 'All' : title(f);
  c.onclick = () => showType(f);
  typesRow.appendChild(c);
});
showType('*');

function setStone(i) {
  current = i;
  stoneBtns.forEach((b, j) => b.classList.toggle('on', j === i));
  if (walk) { walk.setStone(texURL(stones[i])); return; }
  loader.load(texURL(stones[i]), t => {
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(AREA_M / TILE_SIZE_M, AREA_M / TILE_SIZE_M);
    if (marbleMat.map) marbleMat.map.dispose();
    marbleMat.map = t;
    marbleMat.needsUpdate = true;
    if (onStonePicked) onStonePicked();
  });
}

// ---------- AR (Android Chrome + ARCore) ----------
async function startAR() {
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local');
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 30);

  const reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.12, 0.15, 48).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0xc9a96e })
  );
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  const marble = new THREE.Mesh(new THREE.PlaneGeometry(AREA_M, AREA_M).rotateX(-Math.PI / 2), marbleMat);
  marble.visible = false;
  scene.add(marble);

  const session = await navigator.xr.requestSession('immersive-ar', {
    requiredFeatures: ['hit-test'],
    optionalFeatures: ['dom-overlay'],
    domOverlay: { root: overlay }
  });
  await renderer.xr.setSession(session);

  start.style.display = 'none';
  overlay.style.display = 'block';
  hint.textContent = 'Point at the floor and move slowly';

  const viewer = await session.requestReferenceSpace('viewer');
  const hitSource = await session.requestHitTestSource({ space: viewer });

  // Taps on the picker or close button must not also move the marble
  picker.addEventListener('beforexrselect', e => e.preventDefault());
  closeBtn.addEventListener('beforexrselect', e => e.preventDefault());

  let lowest = Infinity, floorFound = false;
  const lastFloor = new THREE.Matrix4();
  const m4 = new THREE.Matrix4(), pos = new THREE.Vector3(), quat = new THREE.Quaternion(), scl = new THREE.Vector3(), up = new THREE.Vector3();

  function layMarble(matrix) {
    marble.position.setFromMatrixPosition(matrix);
    const yaw = new THREE.Euler().setFromQuaternion(renderer.xr.getCamera().quaternion, 'YXZ').y;
    marble.rotation.set(0, yaw, 0); // tiles run square to where you are facing
    marble.visible = true;
    reticle.material.opacity = 0.5;
    hint.textContent = 'Tap the floor to move it';
  }

  // First stone picked: lay it on the detected floor straight away
  onStonePicked = () => { if (!marble.visible && floorFound) layMarble(reticle.visible ? reticle.matrix : lastFloor); };

  session.addEventListener('select', () => {
    if (reticle.visible && current >= 0) layMarble(reticle.matrix);
  });

  closeBtn.onclick = () => session.end();
  session.addEventListener('end', () => location.reload());

  renderer.setAnimationLoop((t, frame) => {
    if (frame) {
      reticle.visible = false;
      const hits = frame.getHitTestResults(hitSource);
      if (hits.length) {
        const pose = hits[0].getPose(renderer.xr.getReferenceSpace());
        if (pose) {
          m4.fromArray(pose.transform.matrix).decompose(pos, quat, scl);
          up.set(0, 1, 0).applyQuaternion(quat);       // surface normal
          if (up.y > 0.95) {                           // level surfaces only
            lowest = Math.min(lowest, pos.y);
            if (pos.y <= lowest + FLOOR_BAND_M) {      // floor, not tables or sofas
              reticle.matrix.copy(m4);
              lastFloor.copy(m4);
              reticle.visible = true;
              if (!floorFound) {
                floorFound = true;
                hint.textContent = 'Floor found · choose your flooring';
                picker.classList.add('show');
              }
            }
          }
        }
      }
    }
    renderer.render(scene, camera);
  });
}

// ---------- START ----------
const arSupported = !!navigator.xr && await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);

if (arSupported) {
  support.textContent = 'See the stone on your own floor, at true scale.';
  go.disabled = false;
  go.onclick = () => startAR().catch(err => { support.textContent = 'Could not open the camera: ' + err.message; });
} else {
  // No AR on this phone: walk through a sample home instead
  const { startWalkthrough } = await import('./walkthrough.js');
  start.style.display = 'none';
  overlay.style.display = 'block';
  closeBtn.style.display = 'none';
  hint.textContent = 'Tap the floor to walk · drag to look around';
  picker.classList.add('show');
  walk = startWalkthrough(texURL(stones[0]));
  stoneBtns[0].classList.add('on');
  current = 0;
}
</script>
</body>
</html>
