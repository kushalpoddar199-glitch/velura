name = "velura-render"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Sites allowed to call the render API (comma-separated, no trailing slash)
ALLOWED_ORIGINS = "https://kushalpoddar199-glitch.github.io,https://velurastudio.in,https://www.velurastudio.in,http://localhost:8765"
MODEL = "fal-ai/nano-banana-2/edit"
RESOLUTION = "1K"
DAILY_PER_IP = "15"
DAILY_TOTAL = "300"

# Usage limits. Create once with:  npx wrangler kv namespace create RATE
# then paste the id it prints below and uncomment.
[[kv_namespaces]]
binding = "RATE"
id = "dd1bf52a14f24d0bbcbfd489a2806924"

# Secret (never commit it):  npx wrangler secret put FAL_KEY
